name: Run Zingg FEBRL Performance and Generate CSV

on:
  push:
    branches:
      - patch-2
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[auto]')"

    steps:
      #1
      - name: Checkout zingg_performance (patch-2)
        uses: actions/checkout@v4
        with:
          ref: patch-2

      #2
      

      #3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      #4
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      #5   
      - name: Run Zingg FEBRL performance script
        env:
          INPUT: config/perf_test_config_febrl120K.json
        run: |
          python perfTestRunner.py
      #6
      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add performance_reports/csv/
          if git diff --cached --quiet; then
            echo "No new CSV generated"
          else
            git commit -m "Add FEBRL performance CSV snapshot [auto]"
            git push
          fi
