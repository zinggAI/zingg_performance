name: Run Zingg Performance Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # runs daily at 2 AM UTC (optional)

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    # Prevent infinite loop when workflow commits CSV
    if: "!contains(github.event.head_commit.message, '[auto]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run performance tests
        env:
          INPUT: config/perf_test_config.json   # update if your path differs
        run: |
          python perfTestRunner.py

      - name: Commit performance CSV reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add performance_reports/csv/
          git commit -m "Add performance CSV report [auto]" || echo "No changes to commit"
          git push
