name: Run Zingg FEBRL Performance and Generate CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      #1
      - name: Checkout zingg_performance (patch-2)
        uses: actions/checkout@v4
        with:
          ref: patch-2

      #2
      - name: Checkout upstream zingg_community_performance_reports 
        uses: actions/checkout@v4
        with:
          repository: zinggAI/zingg_community_performance_reports
          path: community_reports

      #3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      #4
      - name: Install Python dependencies
        run: |
          pip install pandas
      #5   
      - name: Run Zingg FEBRL performance script
        env:
          INPUT: community_reports/perf_test/perf_test_report/testReport_febrl120K.json
        run: |
          python perfTestRunner.py
      #6
      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add results/
          if git diff --cached --quiet; then
            echo "No new CSV generated"
          else
            git commit -m "Add FEBRL performance CSV snapshot [auto]"
            git push
          fi
