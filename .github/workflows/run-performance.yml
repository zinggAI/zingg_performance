name: Run FEBRL Performance and Save CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout zingg_performance (CSV destination)
      - name: Checkout zingg_performance
        uses: actions/checkout@v4

      # 2. Checkout zingg_community_performance_reports (JSON source)
      - name: Checkout zingg_community_performance_reports
        uses: actions/checkout@v4
        with:
          repository: Srishti-8976/zingg_community_performance_reports
          path: community_repo

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          pip install pandas

      # 5. Run FEBRL performance test
      - name: Run performance test
        env:
          INPUT: ${{ github.workspace }}/community_repo/perf_test/perf_test_report/perfTestInput_febrl120K.json
        run: |
          echo "Using INPUT=$INPUT"
          python perfTestRunner.py

      # 6. Commit generated CSV files
      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add perf_reports results || true
          git commit -m "Add FEBRL performance CSV results [auto]" || true
          git push
